# Nexo — proxy reverso (ajuste server_name e certificados)

# Processos do Nexo (ADR-020). Um servidor: só 8000. Mais pessoas: ligue nexo-web@8001, nexo-web@8002...
# (deploy/systemd/nexo-web@.service, com NEXO_REDIS_URL no .env) e acrescente as linhas abaixo.
upstream nexo_web {
    server 127.0.0.1:8000;
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name nexo.exemplo.interno;

    ssl_certificate     /etc/ssl/nexo/fullchain.pem;
    ssl_certificate_key /etc/ssl/nexo/privkey.pem;

    client_max_body_size 55m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/nexo/frontend/dist;

    location /api/ {
        proxy_pass http://nexo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não acrescenta): o daphne --proxy-headers usa este IP na auditoria e nos limites de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }

    location /ws/ {
        proxy_pass http://nexo_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /static/ { alias /opt/nexo/backend/staticfiles/; }

    # SPA: rotas do React caem no index.html. O service worker não é cacheado.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
